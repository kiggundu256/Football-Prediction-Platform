name: Windows desktop build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python on cloud runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable for validation (not uploaded)
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --collect-all keyring --hidden-import keyring.backends.Windows --name FootballPredictionPlatform --add-data "Data/OpenFootball_2022_2026;Data/OpenFootball_2022_2026" app.py
