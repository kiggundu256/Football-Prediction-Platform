name: Windows desktop build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python on cloud runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name FootballPredictionPlatform app.py
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: FootballPredictionPlatform-Windows
          path: dist/FootballPredictionPlatform.exe
          if-no-files-found: error
          retention-days: 14
