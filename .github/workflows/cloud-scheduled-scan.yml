name: Scheduled cloud football scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

concurrency:
  group: football-cloud-scan
  cancel-in-progress: false

jobs:
  scheduled-scan:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cloud-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required cloud secrets
        id: prerequisites
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$API_FOOTBALL_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloud scan skipped: configure DATABASE_URL and API_FOOTBALL_KEY secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.prerequisites.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.prerequisites.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Install cloud worker dependencies
        if: steps.prerequisites.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt
      - name: Run scheduled fixture scan
        if: steps.prerequisites.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m cloud.scheduled_scan
